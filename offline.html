<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#a83f69" />
    <title>Life OS · 暂时离线</title>
    <style>
      *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;color:#392b37;background:radial-gradient(circle at 80% 10%,#f7c6dc 0,transparent 34%),linear-gradient(145deg,#fffafb,#f7edf4);font:16px/1.7 Inter,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(460px,100%);padding:36px;border:1px solid rgba(125,67,97,.14);border-radius:28px;background:rgba(255,255,255,.86);box-shadow:0 26px 70px rgba(94,44,73,.13)}.mark{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;color:#fff;background:linear-gradient(135deg,#40214f,#a83f69);font:800 20px Georgia,serif}h1{margin:24px 0 8px;font:500 30px Georgia,"Songti SC",serif}p{margin:0;color:#796b75}button{width:100%;margin-top:26px;padding:13px 18px;border:0;border-radius:14px;color:#fff;background:#7f365b;font:700 15px inherit;cursor:pointer}small{display:block;margin-top:16px;color:#9b8f97}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">LO</div>
      <h1>网络暂时不可用</h1>
      <p>Life OS 的应用外壳已经保留在设备上。重新联网后即可继续读取和保存私人数据。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
      <small>为保护隐私，财务、健康、客户与 AI 数据不会写入离线公共缓存。</small>
    </main>
  </body>
</html>
